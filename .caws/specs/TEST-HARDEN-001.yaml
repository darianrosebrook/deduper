id: TEST-HARDEN-001
title: 'Harden weak test assertions (disjunctive OR, vacuous if-let, bimodal undo)'
risk_tier: 3
mode: fix
lifecycle_state: active
worktree: test-harden
created_at: '2026-07-16T22:44:31.595Z'
updated_at: '2026-07-16T22:52:25.617Z'
blast_radius:
  modules:
    - DeduperKitTests
    - DeduperUITests
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'Tests/DeduperKitTests/MergeServiceTests.swift'
    - 'Tests/DeduperKitTests/MergeLifecycleTests.swift'
    - 'Tests/DeduperUITests/SessionRemovalTests.swift'
    - 'Tests/DeduperUITests/MergeViewModelTests.swift'
  out: []
invariants:
  - 'No production source changes: this spec touches test files only.'
  - 'Every modified test can fail for the behavior it claims to pin (no disjunctive-OR escape, no silently-skipped if-let assertion block, no else-branch that accepts the opposite outcome).'
acceptance:
  - id: A1
    given: 'SessionRemovalTests selection-advance test with two sessions'
    when: 'deleteSession removes the selected session'
    then: 'the test asserts selectedSessionId == sid2 strictly (a nil selection fails the test)'
  - id: A2
    given: 'MergeViewModelTests undo-partial-failure test with a blocker file at the restore destination'
    when: 'undo runs against the occupied path'
    then: 'the test requires .undoFailed via Issue.record in the else branch (an unexpectedly successful undo fails the test)'
  - id: A3
    given: 'MergeServiceTests / MergeLifecycleTests quarantine-location checks'
    when: 'a transaction entry has a nil trashedPath'
    then: 'the test fails via try #require instead of silently skipping the existence assertion'
  - id: A4
    given: 'MergeViewModelTests invalid-rename-target test'
    when: 'the plan drops the group entirely (regression)'
    then: 'the test fails via try #require(plan.items.first) instead of passing vacuously'
  - id: A5
    given: 'the full suite after hardening'
    when: 'swift test runs'
    then: 'all tests pass, proving the strict assertions match current production behavior'
non_functional: {}
contracts: []
