id: UI-EXACT-APPROVE-PERF-001
title: 'Bulk exact approve: single fetch instead of O(n) per-group SwiftData queries'
risk_tier: 2
mode: fix
lifecycle_state: closed
resolution: completed
closure_notes: 'batchApprovePolicyBackedExactMatches replaced O(N) per-group ReviewDecision FetchDescriptor (10.7k main-thread SwiftData queries, ~98% CPU, appeared hung) with ONE bulk fetch + in-memory upsert + single save. Result unchanged (only undecided policy-backed approved; existing rows reused). Real corpus measurement: 12k approve ~1.9s (was minutes). Test bulkApproveScales kept moderate (N=2000, ~320ms) because a multi-second @MainActor block starves Swift Testing''s other parallel @MainActor tests (surfaced as spurious MergeViewModel .validating-vs-.preview failures at N=12000 — classified as test-starvation, not a regression; clean tree + isolation both pass). Full suite 332/332 x2. KNOWN FOLLOW-UP (out of scope): ~10k inserts+save still block main thread ~2s; a background ModelContext would make it fully non-blocking.'
created_at: '2026-06-05T06:24:06.143Z'
updated_at: '2026-06-05T07:59:19.306Z'
blast_radius:
  modules:
    - 'DeduperUI/GroupListViewModel (batchApprovePolicyBackedExactMatches)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'Sources/DeduperUI/ViewModels/GroupListViewModel.swift'
    - 'Tests/DeduperUITests/TriageFunnelTests.swift'
  out:
    - 'Sources/DeduperApp'
    - 'Sources/DeduperKit'
invariants:
  - 'Bulk policy-backed exact approval issues a single SwiftData fetch of the session''s existing decisions, not one fetch per group. On a ~10.7k-group session the previous per-group fetch loop pegged the main thread (~98% CPU) and appeared hung.'
  - 'The approval result is unchanged: exactly the undecided policy-backed exact groups transition to .approved (reversible), legacy/era-2/non-exact untouched, in-memory decision map + triage summary updated, single save.'
acceptance:
  - id: A1
    given: 'a session with N undecided policy-backed exact groups'
    when: 'bulk approve runs'
    then: 'it performs a single existing-decisions fetch (O(1) queries), not O(N), and approves exactly those N groups'
  - id: A2
    given: 'a corpus-scale session (~12k policy-backed exact groups)'
    when: 'bulk approve runs'
    then: 'it completes well under a bounded time (no per-group-query blowup), with all N approved'
  - id: A3
    given: 'a mixed session (policy-backed + legacy + non-exact, some already decided)'
    when: 'bulk approve runs after the change'
    then: 'only undecided policy-backed groups are approved and previously-decided rows are reused (not duplicated)'
non_functional:
  performance:
    - 'Per-group SwiftData fetch removed; one bulk fetch + in-memory upsert + one save. Verified by a timing test on ~12k groups.'
contracts:
  - name: 'bulk-approve-single-fetch'
    type: behavior
  - name: 'bulk-approve-perf'
    type: contract-test
    path: 'Tests/DeduperUITests/TriageFunnelTests.swift'
