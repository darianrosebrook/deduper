invariants:
  - 'No UI path may bulk-approve non-policy-backed exact groups. There is exactly one bulk-approve entry point, and it approves only policy-backed exact groups (deterministic keeper from SCAN-EXACT-KEEPER-POLICY-001). The pre-existing broad path that approved every sha256Exact group is removed.'
  - 'Policy-backed is determined structurally, never from confidence: matchKind == sha256Exact AND a group rationale line begins with the shared ExactKeeperPolicy.rationaleMarker (which the policy provably emits). Legacy era-1 (legacyUnknown) and era-2 (sha256Exact without the marker) are NOT policy-backed.'
  - 'The shared rationaleMarker is a machine contract: do not localize or edit without a migration; the producer (ExactKeeperPolicy) is asserted to emit it and the consumer (UI) is asserted to require it.'
  - 'Bulk approve writes ReviewDecision=.approved only (reversible); it never moves files. Merge stays the separate downstream MergeSheet step. No DetectionService/MergeService/Persistence-schema/design-token change.'
  - 'A selected session opens on the triage funnel summary, not the flat group list; the list/filters/detail remain reachable as a drill-down. Loading and true-empty states are visually distinct (loading inferred from materialization progress, not from an empty group set).'
  - 'Triage band aggregates are computed from a cached summary refreshed on load/decision/approve/clear, not by decoding rationaleJSON during view-body rendering.'
non_functional:
  performance:
    - 'Policy-backed classification is cached (memoized per materialization load), not recomputed per SwiftUI body evaluation; verified scalable on a ~10.7k-group session.'
