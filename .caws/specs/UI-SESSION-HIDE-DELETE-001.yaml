id: UI-SESSION-HIDE-DELETE-001
title: 'Honest session actions: Hide with unhide, separate confirmed permanent delete (golden-path gotcha 3)'
risk_tier: 2
mode: feature
lifecycle_state: active
created_at: '2026-07-17T00:52:25.198Z'
updated_at: '2026-07-17T00:52:25.198Z'
blast_radius:
  modules:
    - DeduperUI
    - DeduperUITests
    - docs
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'Sources/DeduperUI/ViewModels/SessionListViewModel.swift'
    - 'Sources/DeduperUI/Views/SessionSidebarView.swift'
    - 'Sources/DeduperUI/Views/SessionRowView.swift'
    - 'Tests/DeduperUITests/SessionRemovalTests.swift'
    - 'docs/GOLDEN-PATH.md'
  out: []
invariants:
  - 'Hide is reversible and named honestly: it never deletes data, never carries destructive styling, and every hidden session is recoverable in the UI.'
  - 'Permanent delete requires an explicit confirmation naming what is deleted, and never touches quarantined files or original media (those belong to merge transactions).'
  - 'Permanent delete removes the manifest and artifact files as well as the SwiftData rows — otherwise SessionDiscoveryService.syncIndex resurrects the session on next launch.'
acceptance:
  - id: A1
    given: 'a hidden session'
    when: 'the user enables Show Hidden Sessions and chooses Unhide'
    then: 'isHidden is persisted false and the session reappears in the default sidebar list'
  - id: A2
    given: 'the sidebar with Show Hidden enabled'
    when: 'sessions load'
    then: 'hidden sessions appear (visually distinct) alongside visible ones; with it disabled they are absent'
  - id: A3
    given: 'a session with materialized groups, members, decisions, and manifest+artifact files on disk'
    when: 'permanent delete is confirmed'
    then: 'SessionIndex, GroupSummary, GroupMember, and ReviewDecision rows for that session are gone, its manifest and artifact files are deleted, and other sessions are untouched'
  - id: A4
    given: 'the active selected session'
    when: 'it is hidden or permanently deleted'
    then: 'selection advances to the next remaining visible session (existing pinned behavior preserved)'
  - id: A5
    given: 'the sidebar affordances'
    when: 'inspected'
    then: 'Hide carries no destructive role or trash icon; permanent delete is a separate destructive action behind a confirmation dialog'
non_functional: {}
contracts:
  - name: 'session-hide-delete-behavior'
    type: behavior
