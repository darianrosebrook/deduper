id: SCAN-ZERO-BYTE-EXACT-DISAMBIGUATE-001
title: 'Zero-byte exact disambiguation: exclude empty files from grouping with typed diagnostic'
risk_tier: 2
mode: fix
lifecycle_state: closed
resolution: completed
closure_notes: 'Completed. Zero-byte files all hash to the SHA-256 of empty content, so the exact pass collapsed unrelated empty stub files into one bogus confidence-1.0 group.
1. Fix f9cebc5 on fix/scan-zero-byte-exact; merged 207f1aa. Partition fileSize==0 out of detectDuplicates before any hashing; emit typed assetSkipped/zeroByteFile diagnostic; excluded from exact+perceptual+video.
2. Unit: ScanZeroByteTests 4/4 (no-group+diagnostic, valid exact unchanged, mixed corpus, perceptual-path exclusion); DetectionService 12/12 + ScanLiveness 2/2 unchanged.
3. Real corpus (76k tree, threshold 0.60): groups 10740 -> 10739; ALL-ZERO-BYTE groups 1 -> 0; 11 empty files individually reported via zeroByteFile, 0 leaked into any group (cross-checked vs all 10739 member lists).
4. Correctness-neutral: 10739 valid exact groups (conf 1.0) preserved; cross-folder 86% (9263) intact for future keeper-policy slice.
5. Decision: file-size check before hashing, not empty-SHA-digest special-casing (per invariant).
6. Successors (deferred, unchanged): SCAN-VIDEO-FINGERPRINT-WATCHDOG-001, SCAN-QUERYING-HEARTBEAT-001, exact keeper policy slice.'
created_at: '2026-06-05T00:53:50.036Z'
updated_at: '2026-06-05T01:09:49.611Z'
blast_radius:
  modules:
    - 'DeduperKit/DetectionService (detectDuplicates entry, exact-match pass)'
    - 'DeduperKit/DetectionService (SkipReason diagnostic enum)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'Sources/DeduperKit/DetectionService.swift'
    - 'Sources/DeduperKit/DetectionTypes.swift'
    - 'Tests/DeduperKitTests/ScanZeroByteTests.swift'
  out:
    - 'Sources/DeduperUI'
    - 'Sources/DeduperApp'
invariants:
  - 'Zero-byte files MUST NOT form a sha256Exact duplicate group: empty files all share the SHA-256 of empty content, so grouping them collapses unrelated empty placeholders (.jpg/.MOV/.bmp across unrelated folders) into one bogus confidence-1.0 group.'
  - 'Zero-byte files MUST NOT be returned into perceptual or video detection either; they are empty/corrupt placeholders, not media duplicates, and are excluded from every grouping path.'
  - 'Every zero-byte file is accounted for with a typed diagnostic (assetSkipped, reason=zeroByteFile) — excluded, never silently dropped.'
  - 'Exclusion is decided by file size (fileSize == 0) before any hashing, not by matching the empty-content SHA digest string.'
  - 'Non-zero byte-identical files are unaffected: they still form exactly one sha256Exact group with confidence 1.0 (no correctness regression to valid exact detection).'
acceptance:
  - id: A1
    given: 'multiple zero-byte files with different names, extensions, and paths (e.g. empty.jpg, empty.MOV, empty.bmp)'
    when: 'detection runs'
    then: 'no duplicate group is produced that contains any zero-byte file (no sha256Exact group forms across them)'
  - id: A2
    given: 'a corpus containing zero-byte files'
    when: 'detection runs with a progress sink attached'
    then: 'each zero-byte file emits an assetSkipped progress event carrying its canonical path identity and reason=zeroByteFile'
  - id: A3
    given: 'two or more non-zero byte-identical files'
    when: 'detection runs'
    then: 'they form exactly one group with confidence 1.0 whose members are the byte-identical files (valid exact detection unchanged)'
  - id: A4
    given: 'a mixed corpus of valid non-zero exact duplicates plus several zero-byte files'
    when: 'detection runs'
    then: 'only the valid exact group is returned; no returned group contains a zero-byte file, and every zero-byte file is reported via the zeroByteFile diagnostic'
  - id: A5
    given: 'a corpus with zero-byte files and non-empty non-duplicate images, with perceptual detection enabled (exactOnly=false)'
    when: 'detection runs'
    then: 'zero-byte files never reach perceptual/video grouping and never appear in any returned group'
non_functional:
  performance:
    - 'Zero-byte exclusion is an O(n) size check before hashing; it removes empty files from the candidate set so they incur no prehash/SHA256/perceptual cost.'
    - 'Each excluded zero-byte file is logged/reported with stable canonical identity and reason=zeroByteFile.'
contracts:
  - name: 'zero-byte-exclusion'
    type: behavior
  - name: 'zero-byte-regression'
    type: contract-test
    path: 'Tests/DeduperKitTests/ScanZeroByteTests.swift'
